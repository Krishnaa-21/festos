services:
  backend:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: festos-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///./festos.db
      - AUTH_DISABLED=true
      - JWT_SECRET=festos-dev-insecure-secret-key-change-in-production
      - FESTOS_TZ=Asia/Kolkata
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]

  frontend:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: festos-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
